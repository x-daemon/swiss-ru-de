[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-ru-de"
version = "0.2.0"
description = "Swiss German speech (PC audio, Teams, YouTube) to Russian or German text"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["swiss german", "schweizerdeutsch", "speech recognition", "whisper", "translation", "russian"]
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=1.24",
    "soundcard>=0.4.4",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]
deepl = ["deepl>=1.20"]
offline = ["transformers>=4.40", "sentencepiece>=0.2", "torch>=2.1"]
all = ["swiss-ru-de[claude,deepl,offline]"]
dev = ["pytest>=8"]

[project.scripts]
swiss-ru-de = "swiss_ru_de.cli:main"

[project.gui-scripts]
swiss-ru-de-gui = "swiss_ru_de.gui:main"

[tool.setuptools]
packages = ["swiss_ru_de"]

[tool.pytest.ini_options]
testpaths = ["tests"]
