[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-ru-de"
version = "1.1.7"
description = "Swiss German speech (PC audio, Teams, YouTube) to Russian or German text"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["swiss german", "schweizerdeutsch", "speech recognition", "whisper", "translation", "russian"]
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=1.24",
    "av>=11,<19",  # PyAV 19 dropped an option faster-whisper 1.2.1 uses: audio files fail to decode
    "soundcard>=0.4.4",
    "yt-dlp>=2024.1.1",
    "keyring>=24",
]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]
deepl = ["deepl>=1.20"]
azure = ["azure-cognitiveservices-speech>=1.40"]
llm = ["openai>=2.0"]  # ChatGPT, Gemini and Grok (OpenAI-compatible APIs)
offline = ["transformers>=4.40", "sentencepiece>=0.2", "torch>=2.1"]
# NVIDIA GPU: CUDA libraries for CTranslate2 (no separate CUDA install needed)
gpu = [
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]
all = ["swiss-ru-de[claude,deepl,offline,azure,llm]"]
dev = ["pytest>=8"]

[project.scripts]
swiss-ru-de = "swiss_ru_de.cli:main"

[project.gui-scripts]
swiss-ru-de-gui = "swiss_ru_de.gui:main"

[tool.setuptools]
packages = ["swiss_ru_de"]

[tool.setuptools.package-data]
swiss_ru_de = ["icon.png", "icon.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
