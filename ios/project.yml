# XcodeGen spec - generate the Xcode project with:  brew install xcodegen && xcodegen
name: SwissRuDe
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.1.0"
targets:
  SwissRuDe:
    type: application
    platform: iOS
    sources:
      - path: SwissRuDe
      - path: Shared
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - target: SwissRuDeBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).swissrude
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SwissRuDe/Info.plist
      properties:
        CFBundleDisplayName: Swiss RU-DE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Swiss RU-DE listens to Swiss German speech to show it as text and translate it.
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: AccentColor
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        AppGroupID: $(APP_GROUP_ID)
        BroadcastExtensionID: $(BUNDLE_ID_PREFIX).swissrude.broadcast
    entitlements:
      path: SwissRuDe/SwissRuDe.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
  SwissRuDeBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared
    dependencies:
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).swissrude.broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Swiss RU-DE Audio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
schemes:
  SwissRuDe:
    build:
      targets:
        SwissRuDe: all
        SwissRuDeBroadcast: all
    run:
      config: Debug
    archive:
      config: Release
